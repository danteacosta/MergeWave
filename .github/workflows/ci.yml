name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --editable .
      - name: Run tests
        run: PYTHONWARNINGS=error python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src tests

  arp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mergewave
      - uses: actions/checkout@v4
        with:
          repository: danteacosta/agent-reliability-protocol
          ref: main
          path: agent-reliability-protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate MergeWave against ARP main
        working-directory: mergewave
        run: PYTHONPATH=src:../agent-reliability-protocol/src PYTHONWARNINGS=error python -m unittest discover -s tests -v
